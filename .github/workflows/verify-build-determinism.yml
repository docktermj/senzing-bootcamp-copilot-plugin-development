name: Verify generated Copilot plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild the pinned parent tag
        run: python3 tools/bootcamp-transform/transform.py --tag "$(cat PARENT_VERSION)"
      - name: Validate generated output
        run: python3 tools/bootcamp-transform/validate.py
      - name: Run focused tests
        run: python3 -m unittest discover -s tools/bootcamp-transform/tests -v
      - name: Reject generated drift
        run: git diff --exit-code -- PARENT_VERSION PARENT_COMMIT RELEASE_VERSION .build-manifest.json plugins/senzing-bootcamp
